<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Realidade Aumentada - Modelo 3D</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 1000;
            transition: opacity 0.6s ease;
        }
        
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #007AFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #loading p {
            color: #fff;
            margin-top: 20px;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.3px;
            opacity: 0.7;
        }
        
        #hint {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            pointer-events: none;
            transition: opacity 1s ease;
            text-align: center;
        }
        
        #hint.hidden {
            opacity: 0;
        }
        
        a-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Inicializando câmera</p>
    </div>

    <!-- Dica para o usuário -->
    <div id="hint">Toque e arraste para girar o modelo</div>

    <!-- Cena AR -->
    <a-scene 
        id="scene"
        mindar-image="imageTargetSrc: https://Sah123campos.github.io/Realidade-Aumentada/targets.mind;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <a-entity mindar-image-target="targetIndex: 0">
            
            <a-entity id="model-container" position="0 0 0">
                
                <a-entity 
                    gltf-model="https://Sah123campos.github.io/Realidade-Aumentada/doido.glb"
                    position="0 0 0" 
                    rotation="0 0 0" 
                    scale="0.3 0.3 0.3">
                </a-entity>
                
            </a-entity>
            
        </a-entity>
        
    </a-scene>

    <script>
        (function() {
            'use strict';

            const loading = document.getElementById('loading');
            const hint = document.getElementById('hint');
            const scene = document.getElementById('scene');

            // ===== INICIA A CÂMERA AUTOMATICAMENTE =====
            function startCamera() {
                try {
                    scene.components['mindar-image'].start();
                } catch (error) {
                    console.warn('MindAR start error:', error);
                    // Fallback: tenta novamente após 1 segundo
                    setTimeout(() => {
                        try {
                            scene.components['mindar-image'].start();
                        } catch (e) {
                            console.error('Failed to start camera:', e);
                        }
                    }, 1000);
                }
            }

            // Aguarda o carregamento da cena e inicia
            if (scene.hasLoaded) {
                startCamera();
            } else {
                scene.addEventListener('loaded', startCamera);
            }

            // ===== ESCONDE LOADING APÓS 3 SEGUNDOS =====
            setTimeout(() => {
                loading.classList.add('hidden');
            }, 3000);

            // ===== ESCONDE A DICA APÓS 8 SEGUNDOS =====
            setTimeout(() => {
                hint.classList.add('hidden');
            }, 8000);

            // ===== CONTROLE DE ROTAÇÃO POR TOQUE =====
            const container = document.getElementById('model-container');
            let rotY = 0;
            let rotX = 0;
            let isDragging = false;
            let lastX = 0;
            let lastY = 0;

            // Touch events
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    isDragging = true;
                    lastX = e.touches[0].clientX;
                    lastY = e.touches[0].clientY;
                }
            }, { passive: true });

            document.addEventListener('touchmove', function(e) {
                if (!isDragging || e.touches.length !== 1) return;
                
                const touch = e.touches[0];
                const deltaX = touch.clientX - lastX;
                const deltaY = touch.clientY - lastY;
                
                rotY += deltaX * 0.5;
                rotX += deltaY * 0.3;
                rotX = Math.max(-90, Math.min(90, rotX));
                
                container.setAttribute('rotation', rotX + ' ' + rotY + ' 0');
                
                lastX = touch.clientX;
                lastY = touch.clientY;
            }, { passive: true });

            document.addEventListener('touchend', function() {
                isDragging = false;
            }, { passive: true });

            // Mouse support (desktop)
            let isMouseDown = false;
            document.addEventListener('mousedown', function(e) {
                isMouseDown = true;
                lastX = e.clientX;
                lastY = e.clientY;
            });

            document.addEventListener('mousemove', function(e) {
                if (!isMouseDown) return;
                const deltaX = e.clientX - lastX;
                const deltaY = e.clientY - lastY;
                rotY += deltaX * 0.5;
                rotX += deltaY * 0.3;
                rotX = Math.max(-90, Math.min(90, rotX));
                container.setAttribute('rotation', rotX + ' ' + rotY + ' 0');
                lastX = e.clientX;
                lastY = e.clientY;
            });

            document.addEventListener('mouseup', function() {
                isMouseDown = false;
            });

            // ===== PREVINE ZOOM E SCROLL DA PÁGINA =====
            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
            }, { passive: false });

        })();
    </script>
</body>
</html>
