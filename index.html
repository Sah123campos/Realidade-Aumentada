<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Modelo 3D em RA</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <!-- Cena com seu target -->
    <a-scene 
        mindar-image="imageTargetSrc: https://Sah123campos.github.io/Realidade-Aumentada/targets.mind;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <!-- Seu modelo 3D substituindo o cubo -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-entity 
                gltf-model="https://Sah123campos.github.io/Realidade-Aumentada/doido.glb"
                position="0 0 0" 
                rotation="0 0 0" 
                scale="0.5 0.5 0.5">
            </a-entity>
        </a-entity>
        
    </a-scene>
</body>
</html>
